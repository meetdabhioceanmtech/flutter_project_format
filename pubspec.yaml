name: oceanmtech_dmt
description: A new Flutter project.

publish_to: 'none'  

version: 0.0.1+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations: # Add this line
    sdk: flutter 

  intl: ^0.19.0

  # Firebase
  firebase_core: ^3.9.0
  firebase_analytics: ^11.3.6
  firebase_crashlytics: ^4.2.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  # API Calling
  dio: ^5.7.0
  http: ^1.2.2
  flutter_dotenv: ^5.2.1

  # Code Management 
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  get_it: ^8.0.3
  equatable: ^2.0.7
  dartz: ^0.10.1

  # Locally Data Store
  hive: ^2.2.3
  shared_preferences: ^2.3.4

  # UI Management
  flutter_screenutil: ^5.9.3

  # Basic Project Requirements
  lazy_load_scrollview: ^1.3.0
  localization: ^2.1.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  connectivity_plus: ^6.1.1
  dart_ping: ^9.0.1
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  android_id: ^0.4.0 
  device_info_plus: ^11.2.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2

  # Deep Linking
  app_links: ^6.3.3

  # Error Training and Handle
  catcher_2:
    git:
      url: https://github.com/meetdabhioceanmtech/catcher_2.git
      ref: 6fdfe70da54d0f0160726f3bf51217f7bda1c30e

  # Image Croping
  image_picker: ^1.1.2
  image_editor: ^1.6.0
  extended_image: ^8.2.0

  # HTML Code Viewer
  flutter_html: ^3.0.0-beta.2

dev_dependencies:
  build_runner: ^2.4.13
  flutter_test: 
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/animation/
    - assets/svgs/
    - assets/svgs/common/
    - assets/svgs/job/
    - assets/languages/
    - assets/ca/
    - assets/pngs/
    - assets/pngs/images/
    - assets/pngs/common/

    
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700