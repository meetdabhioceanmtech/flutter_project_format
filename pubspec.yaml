name: oceanmtech_dmt
description: A new Flutter project.

publish_to: 'none'  

version: 0.0.1+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations: # Add this line
    sdk: flutter 

  intl: ^0.19.0

  # Firebase
  firebase_core: ^2.4.0
  firebase_analytics: ^10.0.7
  firebase_crashlytics: ^3.0.7
  firebase_messaging: ^14.1.4
  flutter_local_notifications: ^17.1.2

  # API Calling
  dio: ^5.4.3+1
  http: ^1.2.1
  flutter_dotenv: ^5.1.0 

  # Code Management 
  bloc: ^8.1.0
  flutter_bloc: ^8.1.1
  get_it: ^7.2.0
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Locally Data Store
  hive: ^2.2.3
  shared_preferences: ^2.2.3

  # UI Management
  flutter_screenutil: ^5.6.0

  # Basic Project Requirements
  lazy_load_scrollview: ^1.3.0
  localization: ^2.1.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.9
  connectivity_plus: ^4.0.2
  dart_ping: ^9.0.1
  cached_network_image: ^3.3.1
  path_provider: ^2.0.11
  permission_handler: ^11.3.1
  android_id: ^0.3.6 
  device_info_plus: ^9.1.2
  flutter_isolate: ^2.0.5-pre
  url_launcher: ^6.2.6
  package_info_plus: ^4.2.0

  # Deep Linking
  app_links: ^6.0.2

  # Error Training and Handle
  catcher_2: 
    git:
      url: https://github.com/parthvirani-oceanmtech/catcher.git
      ref: 3fe26d3

  # Image Croping
  image_picker: ^1.1.1
  image_editor: ^1.5.1
  extended_image: ^8.2.0

  # HTML Code Viewer
  flutter_html: ^3.0.0-beta.2
  delete_un_used_assets: ^1.0.1

dev_dependencies:
  build_runner: ^2.3.2
  flutter_test: 
    sdk: flutter
  freezed: ^2.3.2
  json_serializable: ^6.5.4
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.0 

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/animation/
    - assets/svgs/
    - assets/svgs/common/
    - assets/svgs/job/
    - assets/languages/
    - assets/ca/
    - assets/pngs/
    - assets/pngs/home/
    - assets/pngs/images/
    - assets/pngs/common/

    
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700